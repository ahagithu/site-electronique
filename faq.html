<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>FAQ — Boutique Électronique</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Foire aux questions - Commandes, livraison, paiement, garantie." />
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css" />
  
  <style>
    .faq-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 0 60px 0;
    }
    
    .faq-header {
      text-align: center;
      margin-bottom: 50px;
    }
    
    .faq-header h1 {
      color: #1f2937;
      margin-bottom: 15px;
    }
    
    .faq-header p {
      color: #6b7280;
      font-size: 1.1rem;
    }
    
    .search-box {
      max-width: 500px;
      margin: 30px auto;
      position: relative;
    }
    
    .search-box input {
      width: 100%;
      padding: 15px 20px 15px 50px;
      border: 2px solid #e5e7eb;
      border-radius: 50px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    
    .search-box input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .search-box i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
    }
    
    .faq-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 40px;
    }
    
    .category-btn {
      padding: 10px 20px;
      background: #f3f4f6;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .category-btn:hover,
    .category-btn.active {
      background: #2563eb;
      color: white;
    }
    
    .faq-item {
      margin-bottom: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      transition: box-shadow 0.3s;
    }
    
    .faq-item:hover {
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .faq-question {
      padding: 20px;
      background: white;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #1f2937;
      border-bottom: 1px solid transparent;
    }
    
    .faq-question:hover {
      background: #f9fafb;
    }
    
    .faq-item.active .faq-question {
      border-bottom-color: #e5e7eb;
      background: #f9fafb;
    }
    
    .faq-question i {
      transition: transform 0.3s;
    }
    
    .faq-item.active .faq-question i {
      transform: rotate(180deg);
    }
    
    .faq-answer {
      padding: 20px;
      background: white;
      display: none;
      line-height: 1.6;
      color: #4b5563;
    }
    
    .faq-item.active .faq-answer {
      display: block;
    }
